packages:
  - server
  - agent
  - web

# Scripts de instalación de dependencias: ninguno hace falta para Passport Pay
# (módulos nativos opcionales con fallback en JS y el postinstall de @reown/appkit).
# Se niegan de forma explícita para que `pnpm install` (pnpm 11) no falle con
# ERR_PNPM_IGNORED_BUILDS en una máquina limpia.
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  secp256k1: false
  utf-8-validate: false

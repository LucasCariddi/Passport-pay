<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Passport Pay · Speaker view</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0F0F0F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='3' fill='%2312372A'/%3E%3Ccircle cx='16' cy='13' r='5' fill='none' stroke='%23E6D3A3' stroke-width='1.6'/%3E%3Cpath d='M11 13h10M16 8c2 2 2 8 0 10M16 8c-2 2-2 8 0 10' fill='none' stroke='%23E6D3A3' stroke-width='1.2'/%3E%3Cpath d='M10 23h12' stroke='%23E6D3A3' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="/evidence.js"></script>
<style>
  /* Speaker view: layout from design/claude-design/project/Notes.dc.html, colors and type from the
     official HackMeridian template (the deck look), as design/hackmeridian-template/PITCH.md asks. */
  :root {
    --bg: #0F0F0F; --panel: #1A1A1A; --panel-2: #222222; --line: #2E2E2E; --line-2: #3A3A3A;
    --text: #F7F6F2; --text-2: #C9C7C0; --text-3: #9A9893; --yellow: #FDDA24; --stamp: #FF6A3D;
    --head: "Inter Tight", "Instrument Sans", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --fs: 26px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; touch-action: manipulation; overflow-x: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header { position: sticky; top: 0; z-index: 5; background: rgba(15,15,15,0.96); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 28px; }
  .h-left, .h-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0; }
  .brand { font: 800 18px/1.2 var(--head); color: var(--text); letter-spacing: -0.01em; }
  .brand span { color: var(--yellow); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font: 400 12px/1.3 var(--mono); padding: 6px 12px; border-radius: 999px; background: var(--panel-2); color: var(--text-2); max-width: 100%; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .pill.live i { background: var(--yellow); box-shadow: 0 0 0 4px rgba(253,218,36,0.22); }
  .pill.live { color: var(--text); }
  .pill.wait i { background: #C9A227; }
  .timer { font: 700 28px/1 var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
  .timer.over { color: var(--stamp); }
  .of { font: 400 14px/1 var(--mono); color: var(--text-3); }
  .delta { font: 700 13px/1 var(--mono); }
  .delta.late { color: var(--stamp); } .delta.early { color: var(--yellow); }
  .tb { min-height: 40px; min-width: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tb:hover { border-color: var(--yellow); }
  .tb[aria-pressed="true"] { background: var(--yellow); color: var(--bg); border-color: var(--yellow); }
  .tb svg { width: 16px; height: 16px; }

  main { display: flex; gap: 24px; padding: 24px 28px 28px; max-width: 1500px; margin: 0 auto; align-items: stretch; }
  .left { width: 420px; flex: none; display: flex; flex-direction: column; gap: 16px; }
  .lab { font: 400 12px/1.3 var(--mono); letter-spacing: 0.14em; color: var(--text-3); text-transform: uppercase; }
  .pv { display: flex; flex-direction: column; gap: 8px; }
  .pv iframe { display: block; border: 0; border-radius: 10px; background: #050505; pointer-events: none; }
  #pvNow { width: 420px; height: 236px; outline: 2px solid var(--stamp); outline-offset: 0; }
  #pvNext { width: 280px; height: 158px; border-radius: 8px; }
  .navrow { display: flex; gap: 8px; margin-top: auto; }
  #bprev { min-width: 56px; min-height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; }
  #bprev:hover { border-color: var(--yellow); }
  #bnext { flex: 1; min-height: 48px; border-radius: 10px; border: 0; background: var(--yellow); color: var(--bg); font: 800 16px/1 var(--body); }
  #bnext:hover { background: #FFE55C; }
  #bnext:disabled, #bprev:disabled { opacity: 0.45; cursor: not-allowed; }
  .control { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--text-2); min-height: 44px; }
  .control input { accent-color: var(--yellow); width: 20px; height: 20px; }

  .script { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; background: var(--panel); border-radius: 14px; padding: 26px 30px; border: 1px solid var(--line); }
  .script h1 { font: 800 clamp(26px, 2.6vw, 36px)/1.1 var(--head); letter-spacing: -0.01em; color: var(--text); text-transform: uppercase; }
  #text { display: flex; flex-direction: column; gap: 14px; }
  #text p { font-size: var(--fs); line-height: 1.5; color: var(--text); max-width: 62ch; }
  #text p.cue { font-size: calc(var(--fs) * 0.74); color: var(--text-2); border-left: 0; padding-top: 4px; }
  #nextline { font-size: 15px; color: var(--text-3); border-top: 1px solid var(--line); padding-top: 12px; }
  #nextline b { color: var(--text); font-weight: 700; }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
  .chip { font: 400 13px/1.3 var(--mono); padding: 6px 10px; border-radius: 6px; background: var(--panel-2); color: var(--text-2); }
  #open { color: var(--yellow); font: 400 13px/1.3 var(--mono); }

  .index { max-width: 1500px; margin: 0 auto; padding: 0 28px 32px; }
  .index ol { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 10px; }
  .index a { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; }
  .index a:hover { border-color: var(--text-3); }
  .index a.cur { border-color: var(--yellow); background: #262109; }
  .index a b { font: 700 14px/1 var(--mono); color: var(--yellow); font-variant-numeric: tabular-nums; }
  .index a small { margin-left: auto; font: 400 12px/1 var(--mono); color: var(--text-3); }

  #pos { display: none; font: 700 18px/1 var(--mono); padding: 0 6px; font-variant-numeric: tabular-nums; align-self: center; }
  @media (max-width: 900px) {
    header { padding: 12px 16px; position: static; }
    main { flex-direction: column-reverse; padding: 16px; gap: 16px; }
    .left { width: auto; gap: 0; }
    .pv { display: none; }
    .script { padding: 20px; }
    :root { --fs: 21px; }
    .index { padding: 0 16px calc(104px + env(safe-area-inset-bottom)); }
    .navrow { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; margin: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(15,15,15,0.97); border-top: 1px solid var(--line); }
    #bprev, #bnext { min-height: 60px; border-radius: 14px; }
    #bprev { background: var(--panel-2); border: 0; }
    #pos { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="h-left">
    <span class="brand">Passport Pay <span>·</span> speaker view</span>
    <span class="pill" id="status" role="status"><i aria-hidden="true"></i><span id="stxt">Connecting…</span></span>
  </div>
  <div class="h-right">
    <span class="timer" id="timer" aria-label="Elapsed time">00:00</span>
    <span class="of" id="of">of 02:30</span>
    <span class="delta" id="delta" aria-live="polite"></span>
    <button class="tb" id="tplay" type="button" aria-label="Start timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <button class="tb" id="treset" type="button">Reset timer</button>
    <button class="tb" id="wake" type="button" aria-pressed="false" aria-label="Keep the screen on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="tb" id="fminus" type="button" aria-label="Smaller text">A−</button>
    <button class="tb" id="fplus" type="button" aria-label="Larger text">A+</button>
  </div>
</header>

<main>
  <div class="left">
    <div class="pv">
      <span class="lab" id="nowlab">Now · slide 1 of 5</span>
      <iframe id="pvNow" title="Current slide" loading="eager" tabindex="-1"></iframe>
    </div>
    <div class="pv">
      <span class="lab">Next</span>
      <iframe id="pvNext" title="Next slide" loading="eager" tabindex="-1"></iframe>
    </div>
    <label class="control"><input type="checkbox" id="ctrl" checked /> Move the slides from here</label>
    <div class="navrow">
      <button id="bprev" type="button" aria-label="Previous slide"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span id="pos" aria-live="polite">1 / 5</span>
      <button id="bnext" type="button">Next slide</button>
    </div>
  </div>

  <section class="script" aria-labelledby="title">
    <span class="lab" id="meta">Script</span>
    <h1 id="title">Loading…</h1>
    <div id="text" aria-live="polite"></div>
    <p id="nextline"></p>
    <div class="chips">
      <span class="chip">Keys: ← → slides · T timer · + − text</span>
      <span class="chip">Phone: scan the QR on the deck</span>
      <a id="open" href="/presentacion?slide=1" target="passport-pay-deck">Open slide 01 in the deck ↗</a>
    </div>
  </section>
</main>

<div class="index"><span class="lab">All slides</span><ol id="list"></ol></div>


<script>
  const EV = window.PP_EVIDENCE || {};
  const params = new URLSearchParams(location.search);
  const sala = params.get("sala");
  const TOPIC = "passport-pay-pitch-v1-";
  const DECK = "/presentacion";
  let slides = [];
  let n = 0;
  let lastDeck = 0;
  let totalWords = 0;
  // Hard limit for the whole pitch (design/hackmeridian-template/PITCH.md): 2:30, warn from 2:15.
  const LIMIT = 150, WARN = 135;

  const $ = (id) => document.getElementById(id);
  const pad = (x) => String(x).padStart(2, "0");
  const mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  const toSec = (s) => { const m = /^(\d+):(\d+)/.exec(s || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };

  /* --- data: read from the deck itself, so there is one source --- */
  async function load() {
    const html = await (await fetch(DECK, { cache: "no-store" })).text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const all = [...doc.querySelectorAll(".slide")];
    slides = all.map((s, k) => {
      const inj = s.querySelector('aside.note[data-when="injection"]');
      const note = (EV.injection && inj) || s.querySelector("aside.note:not([data-when])");
      const paras = note ? [...note.querySelectorAll("p")].map((p) => ({ cue: p.classList.contains("cue"), text: p.textContent.replace(/\s+/g, " ").trim() })) : [];
      const words = paras.filter((p) => !p.cue).reduce((a, p) => a + (p.text.match(/\S+/g) || []).length, 0);
      return { title: s.dataset.title || `Slide ${k + 1}`, time: s.dataset.time || "", start: toSec(s.dataset.time), dur: +s.dataset.dur || 0, paras, words };
    });
    totalWords = slides.reduce((a, s) => a + s.words, 0);
    $("of").textContent = `of ${mmss(LIMIT)} · ${totalWords} words`;
    $("list").innerHTML = slides.map((s, k) => `<li><a id="s${k + 1}" href="#s${k + 1}" data-k="${k}"><b>${pad(k + 1)}</b>${s.title}<small>${s.time} · ${s.dur} s · ${s.words} w</small></a></li>`).join("");
    $("list").addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); go(+a.dataset.k, true); });
  }

  /* --- previews (the deck in embed mode) --- */
  let pvReady = { now: false, next: false };
  function initPreviews() {
    if (window.matchMedia("(max-width: 900px)").matches) return;
    $("pvNow").src = `${DECK}?embed=1&slide=${n + 1}`;
    $("pvNext").src = `${DECK}?embed=1&slide=${Math.min(n + 2, slides.length)}`;
    $("pvNow").onload = () => { pvReady.now = true; syncPreviews(); };
    $("pvNext").onload = () => { pvReady.next = true; syncPreviews(); };
  }
  function syncPreviews() {
    try {
      if (pvReady.now) $("pvNow").contentWindow.postMessage({ type: "goto", n }, location.origin);
      if (pvReady.next) $("pvNext").contentWindow.postMessage({ type: "goto", n: Math.min(n + 1, slides.length - 1) }, location.origin);
    } catch (e) {}
  }

  /* --- render --- */
  function render() {
    const s = slides[n]; if (!s) return;
    $("meta").textContent = `Script · slide ${n + 1} of ${slides.length} · starts ${s.time} · budget ${s.dur} s · ${s.words} words`;
    $("nowlab").textContent = `Now · slide ${n + 1} of ${slides.length}`;
    $("title").textContent = s.title;
    const box = $("text"); box.textContent = "";
    for (const p of s.paras) { const el = document.createElement("p"); if (p.cue) el.className = "cue"; el.textContent = p.text; box.append(el); }
    $("open").href = `${DECK}?slide=${n + 1}`; $("open").textContent = `Open slide ${pad(n + 1)} in the deck ↗`;
    const nx = slides[n + 1];
    $("nextline").textContent = "";
    if (nx) { $("nextline").append("Next: "); const b = document.createElement("b"); b.textContent = nx.title; $("nextline").append(b); }
    else $("nextline").textContent = "Last slide.";
    $("pos").textContent = `${n + 1} / ${slides.length}`;
    $("bnext").textContent = nx ? "Next slide" : "Last slide";
    $("bnext").disabled = !nx;
    $("bprev").disabled = n === 0;
    document.querySelectorAll("#list a").forEach((a) => { const on = +a.dataset.k === n; a.classList.toggle("cur", on); if (on) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
    history.replaceState(null, "", `${location.pathname}${location.search}#s${n + 1}`);
    try { localStorage.setItem("pp-notes-slide", String(n)); } catch (e) {}
    syncPreviews();
    updateDelta();
  }

  /* --- sync --- */
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("passport-pay-pitch") : null;
  // sender id + sequence: the same message arrives by BroadcastChannel and, later, by ntfy;
  // stale copies must not move the notes (or the deck) backwards
  const SID = Math.random().toString(36).slice(2);
  let seq = 0;
  const lastSeq = {};
  function fresh(m) {
    if (!m.sid || !Number.isInteger(m.seq)) return true;
    if ((lastSeq[m.sid] || 0) >= m.seq) return false;
    lastSeq[m.sid] = m.seq; return true;
  }
  function send(msg) {
    msg = { ...msg, sid: SID, seq: ++seq };
    bc?.postMessage(msg);
    if (sala && !nQuota) { nPending = msg; if (!nBusy) ntfyFlush(); }
  }
  // ntfy.sh rate-limits by IP (HTTP 429): one message at a time, only the latest pending one,
  // retried a few times instead of dropped. The daily quota per IP (code 42908) does not come
  // back until the next day: stop and say so.
  let nPending = null, nBusy = false, nQuota = false;
  async function ntfyFlush() {
    nBusy = true;
    let tries = 0;
    while (nPending) {
      const m = nPending; nPending = null;
      let ok = false;
      try {
        const r = await fetch(`https://ntfy.sh/${TOPIC}${sala}`, { method: "POST", body: JSON.stringify(m) });
        ok = r.ok;
        if (r.status === 429 && (await r.json().catch(() => ({}))).code === 42908) { nQuota = true; nPending = null; setStatus(); break; }
      } catch (e) {}
      if (ok) { tries = 0; continue; }
      if (++tries > 8) { tries = 0; continue; }
      if (!nPending) nPending = m;
      await new Promise((r) => setTimeout(r, 2500));
    }
    nBusy = false;
  }
  function fromDeck(m) {
    if (!m || m.from !== "deck" || m.type !== "slide" || !fresh(m)) return;
    lastDeck = Date.now(); setStatus();
    // echo of one of our older commands (a newer one is on its way): skip it
    if (m.ack && m.ack.sid === SID && m.ack.seq < seq) return;
    if (!running && m.n > 0) startTimer();
    if (m.n !== n) { n = m.n; render(); }
  }
  if (bc) bc.onmessage = (e) => fromDeck(e.data);
  let esOpen = false;
  if (sala) {
    const es = new EventSource(`https://ntfy.sh/${TOPIC}${sala}/sse`);
    es.onopen = () => { esOpen = true; setStatus(); send({ from: "notes", type: "hello" }); };
    es.onerror = () => { esOpen = false; setStatus(); };
    es.onmessage = (e) => { try { const d = JSON.parse(e.data); if (d.event === "message") fromDeck(JSON.parse(d.message)); } catch (err) {} };
  }
  let lastStatus = "";
  function setStatus() {
    const el = $("status");
    const live = Date.now() - lastDeck < 1000 * 60 * 30 && lastDeck > 0;
    let cls = "pill " + (live ? "live" : (sala || bc) ? "wait" : "");
    let txt;
    if (nQuota) { cls = "pill wait"; txt = `Room ${sala}: ntfy.sh hit its daily limit on this network. Try mobile data, or open the notes on the same computer.`; }
    else txt = live ? `Synced with the slides${sala ? " · room " + sala : ""}`
      : sala ? (esOpen ? `Room ${sala}: waiting for the slides…` : `Room ${sala}: connecting…`)
      : "Waiting for the slides on this computer…";
    if (txt === lastStatus && el.className === cls) return;
    lastStatus = txt; el.className = cls; $("stxt").textContent = txt;
  }

  function go(k, user = false) {
    const nk = Math.max(0, Math.min(slides.length - 1, k));
    if (nk === n && !user) return;
    n = nk; render();
    if (user && $("ctrl").checked) send({ from: "notes", type: "goto", n });
  }
  $("bnext").onclick = () => go(n + 1, true);
  $("bprev").onclick = () => go(n - 1, true);
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && !e.target.closest("button, a"))) { e.preventDefault(); go(n + 1, true); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(n - 1, true); }
    else if (e.key.toLowerCase() === "t") running ? pauseTimer() : startTimer();
    else if (e.key === "+" || e.key === "=") setFs(Math.min(44, curFs() + 2));
    else if (e.key === "-") setFs(Math.max(16, curFs() - 2));
  });
  let sx = null;
  document.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(n + (dx < 0 ? 1 : -1), true); sx = null; });

  /* --- timer, with the gap against the planned start of each slide --- */
  let running = false, acc = 0, since = 0;
  const elapsed = () => Math.floor((acc + (running ? Date.now() - since : 0)) / 1000);
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
  function startTimer() { if (running) return; running = true; since = Date.now(); $("tplay").innerHTML = PAUSE; $("tplay").setAttribute("aria-label", "Pause timer"); }
  function pauseTimer() { if (!running) return; acc += Date.now() - since; running = false; $("tplay").innerHTML = PLAY; $("tplay").setAttribute("aria-label", "Start timer"); }
  $("tplay").onclick = () => (running ? pauseTimer() : startTimer());
  $("treset").onclick = () => { acc = 0; since = Date.now(); if (!running) $("timer").textContent = "00:00"; updateDelta(); };
  function updateDelta() {
    const s = slides[n]; const el = $("delta");
    if (!s || s.start == null || (!running && acc === 0)) { el.textContent = ""; return; }
    const d = elapsed() - s.start;
    if (Math.abs(d) < 5) { el.textContent = "on time"; el.className = "delta early"; return; }
    el.textContent = `${d > 0 ? "+" : "−"}${Math.floor(Math.abs(d) / 60)}:${pad(Math.abs(d) % 60)} ${d > 0 ? "behind" : "ahead"}`;
    el.className = "delta " + (d > 0 ? "late" : "early");
  }
  setInterval(() => {
    const e = elapsed();
    $("timer").textContent = mmss(e);
    $("timer").classList.toggle("over", e >= WARN);
    updateDelta(); setStatus();
  }, 500);

  /* --- keep the screen on, text size --- */
  let lock = null;
  async function setWake(on) {
    try {
      if (on && "wakeLock" in navigator) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { if (document.visibilityState === "visible" && $("wake").getAttribute("aria-pressed") === "true") setWake(true); }); }
      else if (lock) { await lock.release(); lock = null; }
      $("wake").setAttribute("aria-pressed", String(on && "wakeLock" in navigator));
    } catch (e) { $("wake").setAttribute("aria-pressed", "false"); }
  }
  $("wake").onclick = () => setWake($("wake").getAttribute("aria-pressed") !== "true");
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("wake").getAttribute("aria-pressed") === "true") setWake(true); });
  function setFs(px) { document.documentElement.style.setProperty("--fs", px + "px"); try { localStorage.setItem("pp-notes-fs", px); } catch (e) {} }
  const curFs = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"), 10) || 24;
  $("fplus").onclick = () => setFs(Math.min(44, curFs() + 2));
  $("fminus").onclick = () => setFs(Math.max(16, curFs() - 2));

  /* --- start --- */
  (async () => {
    await load();
    let start = 0;
    const hm = /^#s(\d+)$/.exec(location.hash);
    if (hm) start = +hm[1] - 1;
    else { try { const ls = localStorage.getItem("pp-slide") ?? localStorage.getItem("pp-notes-slide"); if (ls) start = +ls; } catch (e) {} }
    n = Math.max(0, Math.min(slides.length - 1, start));
    try { const fs = localStorage.getItem("pp-notes-fs"); if (fs) setFs(+fs); } catch (e) {}
    initPreviews();
    render();
    setStatus();
    if (bc) send({ from: "notes", type: "hello" });
    window.addEventListener("hashchange", () => { const m = /^#s(\d+)$/.exec(location.hash); if (m && +m[1] - 1 !== n) go(+m[1] - 1, true); });
  })();
</script>
